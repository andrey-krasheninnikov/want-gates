name: Rust and systemd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test CLI and local API
        run: cargo test --locked
      - name: Build service
        run: cargo build --locked --release
      - name: Test systemd lifecycle on the disposable runner
        run: sudo python3 tests/systemd_smoke.py target/release/wgates
