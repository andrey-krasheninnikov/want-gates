[package]
name = "want-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Local control service for a Want Gates gateway"
license = "MIT"
repository = "https://github.com/andrey-krasheninnikov/want-gates"

[[bin]]
name = "wgates"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
libc = "0.2.191"
serde_json = "1.0.154"
signal-hook = { version = "0.4.6", default-features = false }
url = "2"
percent-encoding = "2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "socks-proxy"] }
sha2 = "0.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3.27.0"
