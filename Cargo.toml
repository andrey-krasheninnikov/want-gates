[package]
name = "want-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Local control service for a Want Gates gateway"
license = "MIT"
repository = "https://github.com/andrey-krasheninnikov/want-gates"

[[bin]]
name = "wgates"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
serde_json = "1.0.154"
signal-hook = { version = "0.4.6", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
